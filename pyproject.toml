[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rayleigh"
version = "0.1.0"
description = "Infer physical dimensions from scientific Python code and detect dimensional inconsistencies."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Rayleigh Contributors"}]
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
rayleigh = "rayleigh.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
